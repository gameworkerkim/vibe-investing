<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="28" y="36" font-size="20" font-weight="700" fill="#111">코일 단면 개념도. 4열 대향류</text>
  <text x="28" y="58" font-size="12" fill="#444">축척 없음. 핀 간격은 확대이며 치수는 2.5mm. 열 피치와 단 피치를 구분한다.</text>
  <g fill="#f4d9c0" stroke="#8a5a33" stroke-width="2">
    <circle cx="200" cy="150" r="16"/><circle cx="200" cy="230" r="16"/><circle cx="200" cy="310" r="16"/><circle cx="200" cy="390" r="16"/>
    <circle cx="320" cy="190" r="16"/><circle cx="320" cy="270" r="16"/><circle cx="320" cy="350" r="16"/><circle cx="320" cy="430" r="16"/>
    <circle cx="440" cy="150" r="16"/><circle cx="440" cy="230" r="16"/><circle cx="440" cy="310" r="16"/><circle cx="440" cy="390" r="16"/>
    <circle cx="560" cy="190" r="16"/><circle cx="560" cy="270" r="16"/><circle cx="560" cy="350" r="16"/><circle cx="560" cy="430" r="16"/>
  </g>
  <line x1="90" y1="270" x2="160" y2="270" stroke="#c45b5b" stroke-width="4"/>
  <text x="48" y="294" font-size="12" fill="#8d3030">공기 45°C</text>
  <line x1="620" y1="270" x2="720" y2="270" stroke="#3d7ec7" stroke-width="4"/>
  <text x="620" y="294" font-size="12" fill="#245">공기 27°C</text>
  <line x1="760" y1="190" x2="680" y2="190" stroke="#3d7ec7" stroke-width="3"/>
  <text x="680" y="176" font-size="12" fill="#245">급수 18°C가 오른쪽에서 들어온다</text>
  <line x1="140" y1="190" x2="50" y2="190" stroke="#c45b5b" stroke-width="3"/>
  <text x="36" y="176" font-size="12" fill="#8d3030">환수 26°C가 왼쪽으로 나간다</text>
  <text x="28" y="490" font-size="13" fill="#222">가로가 공기 흐름이다. 열 피치 25.4mm, 3간격 + 관 9.52mm = 포락 86mm.</text>
  <text x="28" y="512" font-size="13" fill="#222">세로는 단 피치 25.4mm. 핀 피치 2.5mm는 그림의 선 간격으로 재지 않는다.</text>
  <text x="28" y="540" font-size="12" fill="#111">OPEN-RDHX-SK-03 · 개념도 · 축척 없음 · 2026-11-22</text>
</svg>
