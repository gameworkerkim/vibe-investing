<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="36" y="48" font-size="22" font-weight="700" fill="#111">OpenRDHx-A40</text>
  <text x="36" y="78" font-size="14" fill="#333">공랭 서버를 열지 않는다. 뒷문이 배기열을 물에 넘긴다.</text>
  <rect x="36" y="110" width="500" height="400" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <rect x="70" y="150" width="280" height="320" fill="#fff" stroke="#111"/>
  <text x="86" y="176" font-size="12" fill="#666">42U 랙</text>
  <g fill="#eef1f4" stroke="#99a">
    <rect x="88" y="196" width="244" height="48"/>
    <rect x="88" y="256" width="244" height="48"/>
    <rect x="88" y="316" width="244" height="48"/>
    <rect x="88" y="376" width="244" height="48"/>
  </g>
  <rect x="350" y="150" width="46" height="320" fill="#e7f0fa" stroke="#245" stroke-width="2"/>
  <text x="410" y="200" font-size="13" fill="#245">도어 160mm</text>
  <text x="410" y="250" font-size="13" fill="#8d3030">배기 45°C</text>
  <text x="410" y="290" font-size="13" fill="#245">배출 27°C</text>
  <text x="86" y="470" font-size="12" fill="#333">서버 내부 배관은 없다.</text>
  <text x="580" y="160" font-size="16" fill="#111">정격점 하나</text>
  <text x="580" y="200" font-size="20" font-weight="700" fill="#111">40 kW</text>
  <text x="580" y="236" font-size="14" fill="#333">공기 45°C → 27°C</text>
  <text x="580" y="260" font-size="14" fill="#333">물 18°C → 26°C</text>
  <text x="580" y="284" font-size="14" fill="#333">풍량 7,000 m3/h</text>
  <text x="580" y="308" font-size="14" fill="#333">유량 72 L/min</text>
  <text x="580" y="348" font-size="14" fill="#333">팬 7대 = 6 + 1</text>
  <text x="580" y="372" font-size="14" fill="#333">전원 인입 1+1</text>
  <text x="580" y="396" font-size="14" fill="#333">PICV는 기본, BACnet은 옵션</text>
  <text x="580" y="440" font-size="13" fill="#555">130kW 콜드플레이트 랙은 대상이 아니다.</text>
  <text x="36" y="560" font-size="12" fill="#111">OPEN-RDHX-SK-06 · 컨셉 · 축척 없음 · 숫자는 실측 전 설계 목표 · 2026-11-22</text>
</svg>
