<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="1040" height="720" fill="#ffffff"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#111">제어 개념도. 밸브 우선, 팬 7점, 전원 1+1</text>
  <text x="28" y="56" font-size="12" fill="#444">축척 없음. A40 전용. 이 기판으로 더 많은 팬을 겸하지 않는다.</text>
  <rect x="340" y="90" width="360" height="250" fill="#f4f7fb" stroke="#111" stroke-width="2"/>
  <text x="358" y="118" font-size="16" font-weight="700" fill="#111">A40 제어기</text>
  <text x="358" y="146" font-size="12" fill="#333">AI 6: 공기 2, 물 2, 차압 2</text>
  <text x="358" y="168" font-size="12" fill="#333">온습도 1점은 디지털</text>
  <text x="358" y="190" font-size="12" fill="#333">DI 4: 누수, 도어, 화재, 예비</text>
  <text x="358" y="212" font-size="12" fill="#333">PWM 7, 타코 7, PICV 1, 격리 1</text>
  <text x="358" y="234" font-size="12" fill="#333">기본 통신은 Modbus TCP, RTU 병행</text>
  <text x="358" y="256" font-size="12" fill="#333">BACnet, SNMP, 화면은 옵션</text>
  <text x="358" y="278" font-size="12" fill="#333">AC 인입 2회로, 24V 전원 2대</text>
  <text x="358" y="308" font-size="12" fill="#245">펌웨어 서명은 한국에서 한다</text>
  <g font-size="12" fill="#222">
    <rect x="28" y="110" width="270" height="32" fill="#f7f7f7" stroke="#333"/><text x="40" y="131">출구 공기온도. 목표 27°C</text>
    <rect x="28" y="152" width="270" height="32" fill="#f7f7f7" stroke="#333"/><text x="40" y="173">입구 공기, 급수, 환수</text>
    <rect x="28" y="194" width="270" height="32" fill="#f7f7f7" stroke="#333"/><text x="40" y="215">공기측·수측 차압</text>
    <rect x="28" y="236" width="270" height="32" fill="#f7f7f7" stroke="#333"/><text x="40" y="257">노점용 온습도</text>
    <rect x="28" y="278" width="270" height="32" fill="#fdeeee" stroke="#8d3030"/><text x="40" y="299">누수, 도어, 화재</text>
  </g>
  <g font-size="12" fill="#222">
    <rect x="740" y="110" width="270" height="48" fill="#eef3f8" stroke="#245"/>
    <text x="752" y="130">1차: PICV로 유량을 연다</text>
    <text x="752" y="148" font-size="11" fill="#444">출구 27°C가 목표</text>
    <rect x="740" y="168" width="270" height="48" fill="#fff" stroke="#333"/>
    <text x="752" y="188">2차: 팬 6+1</text>
    <text x="752" y="206" font-size="11" fill="#444">밸브가 최대일 때만 증속</text>
    <rect x="740" y="226" width="270" height="48" fill="#fdeeee" stroke="#8d3030"/>
    <text x="752" y="246">격리 밸브는 스프링 닫힘</text>
    <text x="752" y="264" font-size="11" fill="#444">누수와 밸브 전원 상실</text>
  </g>
  <rect x="28" y="390" width="980" height="250" fill="#fafafa" stroke="#888"/>
  <text x="44" y="420" font-size="15" font-weight="700" fill="#111">DRY가 기본이다</text>
  <text x="44" y="448" font-size="13" fill="#333">수온 목표 = max(18°C, 노점+2K). 물이 더 차가우면 CDU에 상향을 요청하고 경보만 올린다.</text>
  <text x="44" y="472" font-size="13" fill="#333">밸브를 닫아 결로를 막는 동작은 사이트 옵션이고, 출하 값은 꺼짐이다.</text>
  <text x="44" y="496" font-size="13" fill="#333">팬 1대 정지: 경보 후 나머지 증속. 총풍량과 그 높이의 누설은 다른 시험이다.</text>
  <text x="44" y="520" font-size="13" fill="#333">문 열림: 즉시 경보, 팬은 120초 유지 후 최소 속도. 화재: 팬 정지, PICV는 현상 유지.</text>
  <text x="44" y="544" font-size="13" fill="#333">통신이 끊기면 마지막 세트포인트로 로컬 운전한다.</text>
  <text x="44" y="590" font-size="12" fill="#111">OPEN-RDHX-SK-05 · 개념도 · 2026-11-22</text>
</svg>
