<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="36" y="42" font-size="22" font-weight="700" fill="#111">OpenRDHx-R50 랙 일체형</text>
  <text x="36" y="68" font-size="13" fill="#333">전환 2단계. 기존 랙을 교체할 때 열교환기가 뒷벽이다. 정격이 아니라 계획이다.</text>
  <rect x="48" y="100" width="250" height="430" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="64" y="124" font-size="12" fill="#666">48U · 폭 800mm</text>
  <g fill="#ffffff" stroke="#99a">
    <rect x="70" y="146" width="150" height="52"/>
    <rect x="70" y="210" width="150" height="52"/>
    <rect x="70" y="274" width="150" height="52"/>
    <rect x="70" y="338" width="150" height="52"/>
    <rect x="70" y="402" width="150" height="52"/>
  </g>
  <rect x="220" y="146" width="58" height="308" fill="#e7f0fa" stroke="#245" stroke-width="2"/>
  <text x="64" y="510" font-size="12" fill="#333">서버 내부 배관 없음</text>
  <text x="330" y="170" font-size="14" fill="#245">후면 베이 280mm</text>
  <text x="330" y="196" font-size="13" fill="#333">4열 코일 + 원심 팬 트레이</text>
  <text x="330" y="222" font-size="13" fill="#333">팬 대수는 곡선 확정 전</text>
  <text x="330" y="264" font-size="14" fill="#8d3030">배기 45°C</text>
  <text x="330" y="288" font-size="14" fill="#245">배출 27°C</text>
  <text x="330" y="328" font-size="14" fill="#111">계획 48 kW</text>
  <text x="330" y="354" font-size="13" fill="#333">풍량 8,400 m3/h</text>
  <text x="330" y="378" font-size="13" fill="#333">물 18°C → 26°C, 86 L/min</text>
  <text x="330" y="418" font-size="13" fill="#333">A40과 같은 밸브, 같은 레지스터</text>
  <text x="330" y="442" font-size="13" fill="#333">힌지로 97kg을 매달지 않음</text>
  <rect x="620" y="110" width="300" height="250" fill="#f7f7f7" stroke="#111"/>
  <text x="640" y="142" font-size="14" fill="#111">측면, 개념</text>
  <rect x="660" y="170" width="150" height="140" fill="#fff" stroke="#111"/>
  <rect x="810" y="170" width="46" height="140" fill="#e7f0fa" stroke="#245" stroke-width="2"/>
  <text x="668" y="340" font-size="12" fill="#333">서버 영역 + 후면 280mm</text>
  <text x="620" y="420" font-size="13" fill="#555">100kW 이상 칩 냉각 랙은 이 그림의 대상이 아니다.</text>
  <text x="620" y="448" font-size="13" fill="#555">48kW는 칼로리미터 전에 카탈로그에 넣지 않는다.</text>
  <text x="36" y="590" font-size="12" fill="#111">OPEN-RDHX-SK-07 · 개념도 · 축척 없음 · R50은 계획 · 2026-11-22</text>
</svg>
