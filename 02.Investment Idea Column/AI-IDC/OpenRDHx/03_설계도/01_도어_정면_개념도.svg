<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1120" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="860" height="1120" fill="#ffffff"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#111">OpenRDHx-A40 정면 개념도</text>
  <text x="36" y="62" font-size="12" fill="#444">축척 없음. 개념도이며 제작도가 아님. 800 x 1950 x 160 mm</text>
  <rect x="180" y="90" width="360" height="860" fill="#f7f7f7" stroke="#111" stroke-width="3"/>
  <rect x="200" y="160" width="320" height="700" fill="#e7f0fa" stroke="#3d6f9a" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="214" y="184" font-size="12" fill="#234">코일 4열, 서버 전고를 덮음</text>
  <text x="214" y="202" font-size="11" fill="#234">포락 86mm. 핀 피치 2.5mm</text>
  <g fill="#f3f4f6" stroke="#111" stroke-width="1.4">
    <circle cx="280" cy="280" r="40"/><circle cx="280" cy="430" r="40"/>
    <circle cx="280" cy="580" r="40"/><circle cx="280" cy="730" r="40"/>
    <circle cx="430" cy="355" r="40"/><circle cx="430" cy="505" r="40"/>
    <circle cx="430" cy="655" r="40"/>
  </g>
  <g fill="#666">
    <circle cx="280" cy="280" r="11"/><circle cx="280" cy="430" r="11"/>
    <circle cx="280" cy="580" r="11"/><circle cx="280" cy="730" r="11"/>
    <circle cx="430" cy="355" r="11"/><circle cx="430" cy="505" r="11"/>
    <circle cx="430" cy="655" r="11"/>
  </g>
  <text x="560" y="300" font-size="13" fill="#222">EC 200mm x 7</text>
  <text x="560" y="320" font-size="13" fill="#222">6운전 + 1예비</text>
  <text x="560" y="344" font-size="12" fill="#444">필요 풍량 7,000 m3/h</text>
  <text x="560" y="364" font-size="12" fill="#444">는 6대 운전 기준</text>
  <rect x="210" y="112" width="300" height="14" rx="4" fill="#3d7ec7"/>
  <rect x="210" y="132" width="300" height="14" rx="4" fill="#c45b5b"/>
  <text x="214" y="106" font-size="12" fill="#333">상부 급수·환수. 접속은 한 곳</text>
  <circle cx="524" cy="119" r="7" fill="#24598a"/>
  <circle cx="524" cy="139" r="7" fill="#8d3030"/>
  <text x="540" y="146" font-size="12" fill="#333">QD 1쌍</text>
  <rect x="250" y="880" width="220" height="14" rx="3" fill="#ddd" stroke="#666"/>
  <text x="214" y="916" font-size="12" fill="#333">하부 접속은 캡. 주문 시에만 위와 맞바꿈</text>
  <polygon points="200,940 520,940 508,964 212,964" fill="#f6f1e4" stroke="#a67c00"/>
  <text x="214" y="986" font-size="12" fill="#333">누수 트레이. 감지 시 격리 밸브만 닫힘</text>
  <rect x="158" y="200" width="16" height="28" fill="#c5c8ce" stroke="#111"/>
  <rect x="158" y="480" width="16" height="28" fill="#c5c8ce" stroke="#111"/>
  <rect x="158" y="800" width="16" height="28" fill="#c5c8ce" stroke="#111"/>
  <text x="78" y="216" font-size="12" fill="#333">힌지 3점</text>
  <text x="36" y="1036" font-size="13" fill="#222">정격점: 공기 45→27°C, 물 18→26°C, 40kW, 72 L/min</text>
  <text x="36" y="1058" font-size="13" fill="#222">계획 중량 건조 70kg / 충수 85kg. 전원 인입 2회로</text>
  <text x="36" y="1096" font-size="12" fill="#111">OPEN-RDHX-SK-01 · 개념도 · 축척 없음 · 2026-11-22</text>
</svg>
