<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" font-family="AppleGothic, 'Nanum Gothic', sans-serif">
  <rect width="980" height="900" fill="#ffffff"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#111">OpenRDHx-A40 측면 개념도</text>
  <text x="32" y="58" font-size="12" fill="#444">축척 없음. 닫힌 문은 두께 160mm. 90도 개방은 아래 평면도에서만 그린다.</text>
  <line x1="40" y1="640" x2="940" y2="640" stroke="#111" stroke-width="2"/>
  <rect x="140" y="100" width="400" height="540" fill="#fafafa" stroke="#111" stroke-width="2.4"/>
  <text x="340" y="90" text-anchor="middle" font-size="12" fill="#333">42U 랙</text>
  <g fill="#eef1f4" stroke="#667">
    <rect x="162" y="140" width="354" height="90"/>
    <rect x="162" y="250" width="354" height="90"/>
    <rect x="162" y="360" width="354" height="90"/>
    <rect x="162" y="470" width="354" height="90"/>
  </g>
  <text x="176" y="190" font-size="13" fill="#333">서버 배기 45°C</text>
  <text x="176" y="300" font-size="13" fill="#333">코일이 서버 전고를 덮음</text>
  <rect x="560" y="100" width="64" height="540" fill="#f7f7f7" stroke="#111" stroke-width="2.4"/>
  <rect x="572" y="124" width="26" height="492" fill="#e7f0fa" stroke="#3d6f9a"/>
  <text x="640" y="150" font-size="14" fill="#111">도어 160mm</text>
  <text x="640" y="172" font-size="12" fill="#444">코일 베이 100mm</text>
  <text x="640" y="192" font-size="12" fill="#444">팬 축방향 50mm</text>
  <circle cx="608" cy="240" r="14" fill="#f3f4f6" stroke="#111"/>
  <circle cx="608" cy="370" r="14" fill="#f3f4f6" stroke="#111"/>
  <circle cx="608" cy="500" r="14" fill="#f3f4f6" stroke="#111"/>
  <text x="640" y="374" font-size="13" fill="#222">팬은 핫아일 면</text>
  <line x1="70" y1="370" x2="136" y2="370" stroke="#3d7ec7" stroke-width="3"/>
  <text x="40" y="356" font-size="12" fill="#333">냉복도</text>
  <line x1="516" y1="320" x2="556" y2="320" stroke="#c45b5b" stroke-width="3"/>
  <text x="450" y="312" font-size="12" fill="#8d3030">45°C</text>
  <line x1="626" y1="290" x2="780" y2="220" stroke="#3d7ec7" stroke-width="3"/>
  <text x="700" y="206" font-size="13" fill="#245">27°C 배출</text>
  <rect x="40" y="680" width="900" height="180" fill="#fafafa" stroke="#888"/>
  <text x="56" y="708" font-size="14" font-weight="700" fill="#111">평면도. 90도 개방</text>
  <text x="56" y="730" font-size="12" fill="#444">힌지는 수직축이다. 측면도에서 문을 평행 이동으로 그리지 않는다.</text>
  <rect x="80" y="752" width="170" height="60" fill="#ffffff" stroke="#111"/>
  <text x="96" y="786" font-size="12" fill="#333">랙 후면</text>
  <rect x="250" y="766" width="56" height="32" fill="#f7f7f7" stroke="#111"/>
  <text x="260" y="786" font-size="11" fill="#333">닫힘</text>
  <rect x="250" y="812" width="230" height="22" fill="none" stroke="#c45b5b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="828" font-size="11" fill="#8d3030">열림 90도, 핫아일</text>
  <text x="520" y="786" font-size="13" fill="#333">충수 약 97kg의 개방 모멘트는 랙 제작사 확인 항목이다.</text>
  <text x="32" y="888" font-size="12" fill="#111">OPEN-RDHX-SK-02 · 개념도 · 축척 없음 · 2026-11-22</text>
</svg>
