<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>말포이 길들이기 · Taming Malfoy</title>
  <meta name="description" content="프린세스 메이커 2형 성인 AU 육성 시뮬. 해리·론·헤르미온느로 전쟁 이후의 드라코를 36개월 가르친다. 한국어·영어·일본어. 21세 이상." />
  <link rel="canonical" href="https://vibequant.cc/PlayMalfoy/" />
  <meta property="og:title" content="말포이 길들이기 · Taming Malfoy" />
  <meta property="og:description" content="Princess Maker-style adult AU. 36 months. KO/EN/JA. 21+." />
  <meta property="og:url" content="https://vibequant.cc/PlayMalfoy/" />
  <meta property="og:image" content="https://vibequant.cc/og/playmalfoy.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="index,follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/game.css?v=11" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://vibequant.cc/">VibeQuant</a>
    <a class="nav-link" href="./" data-i="navPlay">게임</a>
    <a class="nav-link" href="./help/" data-i="navHelp">플레이 방법</a>
    <a class="nav-link" href="#closet" id="nav-closet" data-i="navCloset">옷장</a>
    <a class="nav-link" href="#board" id="nav-board" data-i="board">리더보드</a>
    <span class="spacer"></span>
    <span class="counts" id="play-count"></span>
    <div class="share-wrap">
      <button class="btn" id="btn-share" data-i="share">공유하기</button>
      <div id="share-menu" class="share-menu hidden">
        <button class="share-item" data-share="x">X</button>
        <button class="share-item" data-share="threads">Threads</button>
        <button class="share-item" data-share="copy" data-i="shareCopy">링크 복사</button>
        <button class="share-item hidden" data-share="native" id="share-native" data-i="shareNative">더 보기…</button>
      </div>
    </div>
    <label class="sr" for="lang" data-i="lang">언어</label>
    <select id="lang" class="lang" aria-label="language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </header>

  <section id="gate" class="screen">
    <div class="card stack">
      <h1 data-i="title"></h1>
      <p class="lede" data-i="sub"></p>
      <p class="version" data-i="version">버전 1.1</p>
      <h2 data-i="ageTitle"></h2>
      <p class="disclaimer" data-i="ageBody"></p>
      <div class="row">
        <button class="btn primary" id="age-yes" data-i="ageYes"></button>
        <button class="btn danger" id="age-no" data-i="ageNo"></button>
      </div>
    </div>
  </section>

  <section id="story" class="screen hidden">
    <div class="card stack">
      <h1 data-i="storyH"></h1>
      <p class="lede" style="white-space:pre-line" data-i="story"></p>
      <h2 data-i="howH"></h2>
      <p class="lede" data-i="how"></p>
      <div class="row">
        <button class="btn primary" id="to-pc" data-i="continue"></button>
        <button class="btn" id="btn-load" data-i="load"></button>
        <button class="btn" id="btn-gallery" data-i="gallery"></button>
      </div>
    </div>
  </section>

  <section id="pc" class="screen hidden">
    <div class="stack">
      <h1 data-i="pickPc"></h1>
      <div class="pc-grid">
        <button class="pc-card" data-pc="harry">
          <img src="img/pc-harry.jpg" alt="Harry" />
          <div class="meta">
            <h3 data-i="harryN"></h3>
            <p class="lede" data-i="harryD"></p>
          </div>
        </button>
        <button class="pc-card" data-pc="ron">
          <img src="img/pc-ron.jpg" alt="Ron" />
          <div class="meta">
            <h3 data-i="ronN"></h3>
            <p class="lede" data-i="ronD"></p>
          </div>
        </button>
        <button class="pc-card" data-pc="hermione">
          <img src="img/pc-hermione.jpg" alt="Hermione" />
          <div class="meta">
            <h3 data-i="herN"></h3>
            <p class="lede" data-i="herD"></p>
          </div>
        </button>
      </div>
    </div>
  </section>

  <section id="main" class="screen hidden">
    <div class="main">
      <div class="portrait-wrap">
        <img id="portrait" alt="Malfoy" />
        <div class="hud">
          <span id="hud-date"></span>
          <span id="hud-gold"></span>
          <span id="hud-stress"></span>
        </div>
      </div>
      <div class="card stack">
        <div id="stats" class="stat-list"></div>
        <div class="advisor">
          <div class="advisor-head">
            <span class="advisor-avatar" aria-hidden="true">
              <img src="./img/advisor-hat.png" width="44" height="44" alt="" />
            </span>
            <div>
              <strong data-i="advisorName"></strong>
              <small data-i="advisorIntro"></small>
            </div>
          </div>
          <p id="advisor-msg" class="advisor-msg"></p>
        </div>
        <h3 data-i="pickAct"></h3>
        <nav id="menu-bar" class="menu-bar" aria-label="menu"></nav>
        <div id="acts" class="act-grid"></div>
        <div id="log" class="log"></div>
        <div class="row">
          <button class="btn primary" id="btn-closet-2" data-i="navCloset"></button>
          <button class="btn" id="btn-gallery-2" data-i="gallery"></button>
          <button class="btn" id="btn-board-2" data-i="board"></button>
          <button class="btn" id="btn-share-2" data-i="share"></button>
          <button class="btn" id="btn-new" data-i="newGame"></button>
        </div>
      </div>
    </div>
  </section>

  <section id="event" class="screen hidden">
    <div class="card stack">
      <img id="event-art" class="event-art" alt="" />
      <div id="event-body" class="lede"></div>
      <div id="event-choices" class="row"></div>
    </div>
  </section>

  <section id="end" class="screen hidden">
    <div class="card stack">
      <p class="lede" data-i="ending"></p>
      <img id="end-art" class="end-art" alt="" />
      <h1 id="end-title"></h1>
      <p id="end-body" class="lede"></p>
      <div class="row">
        <button class="btn primary" id="again" data-i="again"></button>
        <button class="btn" id="end-gal" data-i="gallery"></button>
        <button class="btn" id="end-board" data-i="board"></button>
        <button class="btn" id="end-share" data-i="share"></button>
      </div>
      <div id="rate-form" class="rate">
        <h3 data-i="rateTitle"></h3>
        <div class="rate-ending-row">
          <span class="rate-label" data-i="rateEnding"></span>
          <span id="rate-ending" class="rate-ending"></span>
        </div>
        <div class="stars" id="rate-stars" role="radiogroup">
          <button type="button" class="star" data-star="1" aria-label="1">★</button>
          <button type="button" class="star" data-star="2" aria-label="2">★</button>
          <button type="button" class="star" data-star="3" aria-label="3">★</button>
          <button type="button" class="star" data-star="4" aria-label="4">★</button>
          <button type="button" class="star" data-star="5" aria-label="5">★</button>
        </div>
        <input id="rate-name" class="rate-input" type="text" maxlength="30" />
        <textarea id="rate-comment" class="rate-input" rows="2" maxlength="200"></textarea>
        <div class="row">
          <button class="btn primary" id="rate-submit" data-i="rateSubmit"></button>
        </div>
      </div>
      <p id="rate-thanks" class="lede hidden" data-i="rateThanks"></p>
    </div>
  </section>

  <section id="closet" class="screen hidden">
    <div class="stack">
      <h1 id="closet-title"></h1>
      <p id="closet-desc" class="lede"></p>
      <p id="closet-gold" class="lede"></p>
      <div id="closet-grid" class="closet-grid"></div>
      <button class="btn" id="closet-back" data-i="back"></button>
    </div>
  </section>

  <section id="gallery" class="screen hidden">
    <div class="stack">
      <h1 id="gal-title"></h1>
      <div id="gal-grid" class="gal-grid"></div>
      <button class="btn" id="gal-back" data-i="back"></button>
    </div>
  </section>

  <section id="board" class="screen hidden">
    <div class="stack">
      <h1 id="board-title" data-i="board"></h1>
      <div id="board-list" class="board-list"></div>
      <button class="btn" id="board-back" data-i="back"></button>
    </div>
  </section>

  <div id="transition" class="transition hidden" aria-hidden="true">
    <div class="transition-inner">
      <span class="transition-title" id="transition-title"></span>
      <span class="transition-sub" id="transition-sub"></span>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script type="module" src="./js/game.js?v=11"></script>
</body>
</html>
