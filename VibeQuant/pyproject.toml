[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-quant"
version = "0.0.1"
description = "Open-source quant engine, API-level compatible with GS Quant (gs_quant -> vi_quant, Gs -> Vi)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["quantitative-finance", "gs-quant", "derivatives", "risk-management", "backtesting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
]

[project.optional-dependencies]
data = ["yfinance>=0.2", "fredapi>=0.5", "duckdb>=0.9"]
pricing = ["QuantLib>=1.30"]
dev = ["pytest>=7", "flake8>=6"]

[project.urls]
Homepage = "https://github.com/gameworkerkim/vibe-investing/tree/main/VibeQuant"

[tool.setuptools.packages.find]
include = ["vi_quant*"]
