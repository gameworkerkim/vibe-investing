name = "vibequant-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Set by setup-secrets.sh / bootstrap (do not commit real account secrets here).
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[vars]
DEFAULT_PROVIDER = "yahoo"

# Uncomment after bootstrap creates resources:
# [[d1_databases]]
# binding = "DB"
# database_name = "vibequant"
# database_id = "<id>"

# [[r2_buckets]]
# binding = "DATA"
# bucket_name = "vibequant-data"

# Free-tier: keep Cron optional / tiny (10 ms CPU). Prefer lazy fill if needed.
# [triggers]
# crons = ["0 8 * * *"]
