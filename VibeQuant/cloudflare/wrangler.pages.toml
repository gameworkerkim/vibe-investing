# DEPRECATED as a deploy --config target.
# Cloudflare Pages does NOT support custom wrangler config paths (--config).
#
# Canonical Pages config lives next to the site:
#   ../pages/wrangler.toml
#
# Deploy:
#   cd ../pages && npx wrangler pages deploy . --project-name=vibequant-web
#   or: ./scripts/deploy.sh
#
# Kept only as a pointer for humans / older docs.
name = "vibequant-web"
compatibility_date = "2026-07-01"
pages_build_output_dir = "../pages"
