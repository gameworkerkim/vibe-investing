<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Leaf — 화보집</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  #viewer {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 하단 네비 + safe-area 만큼 확보 — 버튼이 화보 위로 겹치지 않게 */
    padding: 48px 12px calc(88px + env(safe-area-inset-bottom, 0px));
  }

  #image-container {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    display: inline-block;
    line-height: 0;
  }

  #photo {
    max-width: min(95vw, 100%);
    max-height: calc(100dvh - 48px - 88px - env(safe-area-inset-bottom, 0px));
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  #photo-canvas {
    max-width: min(95vw, 100%);
    max-height: calc(100dvh - 48px - 88px - env(safe-area-inset-bottom, 0px));
    display: none;
    pointer-events: none;
  }

  #watermark-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
  }

  .wm-line {
    position: absolute;
    white-space: nowrap;
    color: rgba(255, 255, 255, 0.11);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    transform: rotate(-25deg);
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  #nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.72) 35%, rgba(0,0,0,0.92) 100%);
  }
  #nav button {
    flex: 1 1 0;
    max-width: 148px;
    min-height: 48px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28);
    color: #fff;
    padding: 12px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #page-indicator {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    z-index: 100;
    font-size: 13px;
  }

  #identity-chip {
    position: fixed;
    top: calc(36px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    color: rgba(255,255,255,0.35);
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }

  #capture-warning {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    color: #ff4444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    text-align: center;
    padding: 20px;
  }
  #capture-warning.show { opacity: 1; }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.6);
    font-size: 15px;
    z-index: 50;
  }
</style>
</head>
<body>

<div id="loading">불러오는 중…</div>
<div id="viewer" style="visibility:hidden">
  <div id="image-container">
    <img id="photo" src="" alt="화보" crossorigin="anonymous">
    <canvas id="photo-canvas" aria-hidden="true"></canvas>
    <div id="watermark-overlay"></div>
  </div>
</div>

<div id="page-indicator"></div>
<div id="identity-chip"></div>
<div id="capture-warning">⚠ 캡처가 감지되었습니다.<br>서버에 기록됩니다.</div>

<nav id="nav" aria-label="페이지 이동">
  <button type="button" id="prev-btn">⟨ 이전</button>
  <button type="button" id="next-btn">다음 ⟩</button>
</nav>

<script>
// ── 설정 ──
const ALBUM_ID = 1;
const REPORT_URL = 'api/capture-alert';
const META_URL = 'api/albums/' + ALBUM_ID + '/meta';
const IDENTITY_URL = 'api/viewer-identity';
const WM_MAGIC = [0x4c, 0x45, 0x41, 0x46, 0x57, 0x4d, 0x31]; // LEAFWM1
let pageCount = 0;
let currentIndex = 0;
let pageUrls = [];   // meta에서 받은 서명 URL 배열 (index+1 = 페이지번호)
let viewerIdentity = {
  sessionId: 'pending',
  ip: 'unknown',
  email: 'guest@leaf.local',
  label: 'Leaf | guest',
};

function identityPayload() {
  return JSON.stringify({
    v: 1,
    sid: viewerIdentity.sessionId,
    ip: viewerIdentity.ip,
    email: viewerIdentity.email,
    album: ALBUM_ID,
    page: currentIndex + 1,
    ts: new Date().toISOString(),
  });
}

function watermarkText() {
  return (
    'Leaf | ' + viewerIdentity.email +
    ' | ' + viewerIdentity.sessionId.slice(0, 8) +
    ' | ' + viewerIdentity.ip +
    ' | 무단전재 금지'
  );
}

async function reportCapture(detail) {
  try {
    await fetch(REPORT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        albumId: ALBUM_ID,
        page: currentIndex + 1,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        detail: detail,
        sessionId: viewerIdentity.sessionId,
        email: viewerIdentity.email,
      }),
      keepalive: true,
    });
  } catch (_) { /* silent */ }
}

// ── 시각적 워터마크 (이메일·세션·IP) ──
function renderWatermark() {
  const overlay = document.getElementById('watermark-overlay');
  overlay.innerHTML = '';
  const container = document.getElementById('image-container');
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  if (!w || !h) return;

  const text = watermarkText();
  const fontSize = Math.max(11, Math.min(w, h) * 0.028);
  const stepX = fontSize * Math.max(14, text.length * 0.55);
  const stepY = fontSize * 5.5;

  for (let y = -stepY; y < h + stepY; y += stepY) {
    for (let x = -stepX; x < w + stepX; x += stepX) {
      const span = document.createElement('span');
      span.className = 'wm-line';
      span.textContent = text;
      span.style.cssText =
        'left:' + x + 'px; top:' + y + 'px;' +
        'font-size:' + fontSize + 'px;' +
        'opacity:' + (0.07 + Math.random() * 0.05) + ';';
      overlay.appendChild(span);
    }
  }

  const chip = document.getElementById('identity-chip');
  chip.textContent = viewerIdentity.label;
}

// ── 보이지 않는 워터마크 (LSB, LEAFWM1 페이로드) ──
function utf8Bytes(str) {
  return Array.from(new TextEncoder().encode(str));
}

function buildLeafPayload(str) {
  const data = utf8Bytes(str);
  const len = data.length;
  return WM_MAGIC.concat([
    (len >>> 24) & 0xff,
    (len >>> 16) & 0xff,
    (len >>> 8) & 0xff,
    len & 0xff,
  ]).concat(data);
}

function embedInvisibleWatermark(imageData, payloadStr) {
  const payload = buildLeafPayload(payloadStr);
  const bits = [];
  for (let i = 0; i < payload.length; i++) {
    for (let b = 7; b >= 0; b--) bits.push((payload[i] >> b) & 1);
  }
  const data = imageData.data;
  const step = 4; // every pixel, blue channel LSB
  let bitIdx = 0;
  for (let i = 0; i < data.length && bitIdx < bits.length; i += step) {
    data[i + 2] = (data[i + 2] & 0xfe) | bits[bitIdx++];
  }
  // terminator marker length already in header
  return imageData;
}

/** Extract LEAFWM1 payload from ImageData — used by scripts/extract-invisible-wm.html too */
function extractInvisibleWatermark(imageData) {
  const data = imageData.data;
  const bits = [];
  for (let i = 0; i < data.length; i += 4) {
    bits.push(data[i + 2] & 1);
  }
  const bytes = [];
  for (let i = 0; i + 7 < bits.length; i += 8) {
    let v = 0;
    for (let b = 0; b < 8; b++) v = (v << 1) | bits[i + b];
    bytes.push(v);
  }
  for (let m = 0; m < WM_MAGIC.length; m++) {
    if (bytes[m] !== WM_MAGIC[m]) return null;
  }
  const len = (bytes[7] << 24) | (bytes[8] << 16) | (bytes[9] << 8) | bytes[10];
  if (len <= 0 || len > 4096) return null;
  const slice = bytes.slice(11, 11 + len);
  try {
    return new TextDecoder().decode(Uint8Array.from(slice));
  } catch (_) {
    return null;
  }
}
window.__LEAF_EXTRACT_WM = extractInvisibleWatermark;

function paintWithInvisibleWm(img) {
  const canvas = document.getElementById('photo-canvas');
  const photo = document.getElementById('photo');
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  if (!w || !h) return;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  try {
    // 1) 픽셀에 구운 시각적 신원 워터마크 (CSS 제거·OS 스크린샷에도 남음)
    const text = watermarkText();
    const fontSize = Math.max(14, Math.round(Math.min(w, h) * 0.028));
    ctx.save();
    ctx.font = '700 ' + fontSize + 'px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.translate(w * 0.5, h * 0.5);
    ctx.rotate(-25 * Math.PI / 180);
    const stepX = fontSize * Math.max(14, text.length * 0.55);
    const stepY = fontSize * 5.5;
    for (let y = -h; y < h; y += stepY) {
      for (let x = -w; x < w; x += stepX) {
        ctx.fillText(text, x, y);
      }
    }
    ctx.restore();

    // 2) LSB 비가시 워터마크 (시각 합성 이후 — 최종 픽셀 기준)
    const imageData = ctx.getImageData(0, 0, w, h);
    embedInvisibleWatermark(imageData, identityPayload());
    ctx.putImageData(imageData, 0, 0);

    canvas.style.display = 'block';
    photo.style.display = 'none';
    canvas.style.maxWidth = getComputedStyle(photo).maxWidth;
    canvas.style.maxHeight = getComputedStyle(photo).maxHeight;
  } catch (err) {
    canvas.style.display = 'none';
    photo.style.display = 'block';
    console.warn('invisible watermark skipped', err);
  }
}

function loadImage(index) {
  const img = document.getElementById('photo');
  const canvas = document.getElementById('photo-canvas');
  canvas.style.display = 'none';
  img.style.display = 'block';
  document.getElementById('page-indicator').textContent =
    '화보 ' + (index + 1) + ' / ' + pageCount;

  img._retrying = false;
  img.src = pageUrls[index] || '';

  img.onload = function () {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('viewer').style.visibility = 'visible';
    paintWithInvisibleWm(img);
    renderWatermark();
  };

  img.onerror = function () {
    // 서명 URL 만료(403)·세션 갱신 필요 시: 메타 재조회 후 1회 재시도
    if (!img._retrying) {
      img._retrying = true;
      loadMeta().then(function () {
        img.src = pageUrls[currentIndex] || '';
      }).catch(function () {
        showWarning('이미지를 불러오지 못했습니다');
      });
      return;
    }
    showWarning('화보를 불러오지 못했습니다');
  };
}

// ── 서명 URL 메타 조회 (만료 시 재조회) ──
async function loadMeta() {
  const res = await fetch(META_URL, { credentials: 'same-origin' });
  if (res.status === 429) {
    showWarning('요청이 많습니다. 잠시 후 다시 시도하세요');
    return false;
  }
  if (!res.ok) throw new Error('meta ' + res.status);
  const meta = await res.json();
  pageCount = meta.totalPages || 0;
  pageUrls = meta.pages || [];
  return pageCount > 0;
}

function next() { currentIndex = (currentIndex + 1) % pageCount; loadImage(currentIndex); }
function prev() { currentIndex = (currentIndex - 1 + pageCount) % pageCount; loadImage(currentIndex); }

document.getElementById('next-btn').addEventListener('click', next);
document.getElementById('prev-btn').addEventListener('click', prev);

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

document.addEventListener('contextmenu', function (e) {
  e.preventDefault();
  showWarning('우클릭이 차단되었습니다');
  reportCapture('contextmenu');
});

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
    e.preventDefault();
    showWarning('인쇄가 차단되었습니다');
    reportCapture('print_attempt');
  }
});

let lastVisibilityChange = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    lastVisibilityChange = Date.now();
  } else {
    const hiddenDuration = Date.now() - lastVisibilityChange;
    if (hiddenDuration > 100 && hiddenDuration < 2500) {
      reportCapture('mobile_visibility_spike');
    }
  }
});

function showWarning(msg) {
  const el = document.getElementById('capture-warning');
  el.innerHTML = msg;
  el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 1500);
}

async function loadIdentity() {
  try {
    const res = await fetch(IDENTITY_URL, { credentials: 'same-origin' });
    const data = await res.json();
    viewerIdentity = {
      sessionId: data.sessionId || 'anon',
      ip: data.ip || 'unknown',
      email: data.email || 'guest@leaf.local',
      label: data.label || ('Leaf | ' + (data.email || 'guest')),
    };
  } catch (_) {
    viewerIdentity.sessionId = 'local-' + Math.random().toString(36).slice(2, 10);
  }
}

(async function init() {
  await loadIdentity();
  try {
    if (await loadMeta()) {
      loadImage(0);
    } else {
      document.getElementById('loading').textContent = '화보집을 불러오지 못했습니다.';
    }
  } catch (err) {
    document.getElementById('loading').textContent = '화보집을 불러오지 못했습니다.';
  }
})();

// 서명 URL TTL(120s)에 대비해 60초마다 사전 갱신 (활성 탭일 때만)
setInterval(function () {
  if (!document.hidden) {
    loadMeta().catch(function () { /* silent */ });
  }
}, 60000);

window.addEventListener('resize', function () {
  renderWatermark();
});
</script>
</body>
</html>
