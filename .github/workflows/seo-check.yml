name: seo-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  push:
    paths:
      - "VibeQuant/pages/**"
      - "VibeQuant/content/**"
      - ".github/workflows/seo-check.yml"

concurrency:
  group: seo-check
  cancel-in-progress: true

jobs:
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Run SEO checks
        working-directory: VibeQuant
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/seo_check.py
